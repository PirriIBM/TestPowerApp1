Screens:
  TicketsScreen:
    Properties:
      Fill: =RGBA(240, 244, 248, 1)
      LoadingSpinnerColor: =RGBA(0, 51, 102, 1)
    Children:
      - SideNavContainer3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(26, 26, 46, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =250
          Children:
            - NavLogoLabel3:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Fill: =RGBA(15, 15, 30, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =80
                  PaddingLeft: =16
                  PaddingRight: =16
                  Size: =20
                  Text: ="MyApp"
                  Width: =250
            - NavDivider3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  BorderStyle: =%BorderStyle.RESERVED%.Solid
                  DisplayMode: =%DisplayMode.RESERVED%.Edit
                  Fill: =RGBA(255, 255, 255, 0.1)
                  Height: =1
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =250
            - NavHomeBtn3:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =%BorderStyle.RESERVED%.Solid
                  BorderThickness: =0
                  Color: =RGBA(200, 200, 220, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  DisplayMode: =%DisplayMode.RESERVED%.Edit
                  Fill: =RGBA(26, 26, 46, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  Height: =56
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(50, 50, 80, 1)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
                  PaddingLeft: =24
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 80, 160, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Home"
                  VerticalAlign: =%VerticalAlign.RESERVED%.Middle
                  Width: =250
            - NavClientesBtn3:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =%BorderStyle.RESERVED%.Solid
                  BorderThickness: =0
                  Color: =RGBA(200, 200, 220, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  DisplayMode: =%DisplayMode.RESERVED%.Edit
                  Fill: =RGBA(26, 26, 46, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Normal
                  Height: =56
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(50, 50, 80, 1)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Navigate(ClientesScreen, ScreenTransition.Fade)
                  PaddingLeft: =24
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 80, 160, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Clientes"
                  VerticalAlign: =%VerticalAlign.RESERVED%.Middle
                  Width: =250
            - NavTicketsBtn3:
                Control: Classic/Button@2.2.0
                Properties:
                  Align: =Align.Left
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =%BorderStyle.RESERVED%.Solid
                  BorderThickness: =0
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =ColorFade(Self.Fill, 90%)
                  DisabledFill: =ColorFade(Self.Fill, 70%)
                  DisplayMode: =%DisplayMode.RESERVED%.Edit
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  Height: =56
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(0, 100, 180, 1)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: =Navigate(TicketsScreen, ScreenTransition.Fade)
                  PaddingLeft: =24
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 80, 160, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Text: ="Tickets"
                  VerticalAlign: =%VerticalAlign.RESERVED%.Middle
                  Width: =250
      - ContentArea3:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(240, 244, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =32
            PaddingLeft: =32
            PaddingRight: =32
            PaddingTop: =32
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width - 250
            X: =250
          Children:
            - PageTitleLabel3:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(26, 26, 46, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =80
                  Size: =36
                  Text: ="Panel de Tickets"
                  Width: =800
            - PageSubtitleLabel3:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(100, 110, 130, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Segoe UI'
                  Height: =50
                  Size: =18
                  Text: ="Crea y gestiona tus tickets de soporte"
                  Width: =800
      - GalleryDocs:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =499
            Items: =Filter(Documents, IsBlank(SearchBoxDocs.Text) Or StartsWith(Name, SearchBoxDocs.Text))
            TemplateSize: =120
            Width: =1064
            X: =280
            Y: =193
          Children:
            - Image3:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  BorderThickness: =2
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =72
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =72
                  X: =16
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Title3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.Name
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =103
                  Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle3.Size * 1.8)) / 2
            - Subtitle3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(96, 94, 92, 1)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =12
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    ="Por: " & ThisItem.Author.DisplayName & "  |  Mod: " & Text(ThisItem.Modified, "dd/mm/yyyy") & "  |  Creado: " & Text(ThisItem.Created, "dd/mm/yyyy")
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title3.Width
                  X: =Title3.X
                  Y: =Title3.Y + Title3.Height
            - IconEliminarDoc:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(196, 49, 75, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =36
                  HoverColor: =RGBA(164, 38, 44, 1)
                  Icon: =Icon.Trash
                  OnSelect: =Set(varDocABorrar, ThisItem); Set(varConfirmarBorrado, "doc")
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  Width: =36
                  X: =Parent.TemplateWidth - NextArrow3.Width - Self.Width - 20
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - NextArrow3:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(166, 166, 166, 1)
                  DisabledBorderColor: =RGBA(56, 56, 56, 1)
                  DisabledColor: =RGBA(119, 119, 119, 1)
                  Height: =50
                  Icon: =Icon.ChevronRight
                  OnSelect: =Set(varDocSeleccionado, ThisItem); Navigate(EditDocScreen, ScreenTransition.Fade)
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="Ver los detalles del elemento"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
                  Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            - Separator3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - Rectangle3:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Height: =Parent.TemplateHeight - Separator3.Height
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =4
      - SearchBoxDocs:
          Control: Classic/TextInput@2.3.2
          Properties:
            Align: =%Align.RESERVED%.Left
            BorderColor: =RGBA(220, 222, 230, 1)
            BorderThickness: =1
            Color: =RGBA(50, 49, 48, 1)
            Default: =""
            DisabledBorderColor: =ColorFade(Self.BorderColor, 40%)
            DisabledColor: =ColorFade(Self.Color, 40%)
            DisabledFill: =Self.Fill
            DisplayMode: =%DisplayMode.RESERVED%.Edit
            FocusedBorderThickness: =3
            Font: =Font.'Segoe UI'
            FontWeight: =%FontWeight.RESERVED%.Normal
            Format: =%TextFormat.RESERVED%.Text
            HintText: ="Filtrar por nombre del documento..."
            HoverBorderColor: =Self.Color
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            Mode: =%TextMode.RESERVED%.SingleLine
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =14
            VirtualKeyboardMode: =%VirtualKeyboardMode.RESERVED%.Auto
            Width: =1064
            X: =280
            Y: =145
      - RectOverlayDoc:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 0, 255, 1)
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            Visible: =varConfirmarBorrado = "doc"
            Width: =Parent.Width
      - RectPanelDoc:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(220, 222, 230, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Visible: =varConfirmarBorrado = "doc"
            Width: =480
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
      - LblConfirmDoc:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(26, 26, 46, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =60
            Size: =16
            Text: ="¿Estás seguro que deseas borrar el item?"
            Visible: =varConfirmarBorrado = "doc"
            Width: =440
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - 200) / 2 + 30
      - BtnSiDoc:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =RGBA(196, 49, 75, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(164, 38, 44, 1)
            OnSelect: =Remove(Documents, varDocABorrar); Set(varConfirmarBorrado, "")
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(140, 20, 30, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="Sí, eliminar"
            Visible: =varConfirmarBorrado = "doc"
            Width: =200
            X: =(Parent.Width - 200) / 2 - 110
            Y: =(Parent.Height - 200) / 2 + 120
      - BtnNoDoc:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(220, 222, 230, 1)
            BorderThickness: =1
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Normal
            Height: =44
            HoverBorderColor: =RGBA(220, 222, 230, 1)
            HoverColor: =RGBA(50, 49, 48, 1)
            HoverFill: =RGBA(240, 244, 248, 1)
            OnSelect: =Set(varConfirmarBorrado, "")
            PressedBorderColor: =RGBA(220, 222, 230, 1)
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(220, 222, 230, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Text: ="No, cancelar"
            Visible: =varConfirmarBorrado = "doc"
            Width: =200
            X: =(Parent.Width - 200) / 2 + 110
            Y: =(Parent.Height - 200) / 2 + 120
