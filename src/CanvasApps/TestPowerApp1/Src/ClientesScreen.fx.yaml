                Color: =RGBA(166, 166, 166, 1)
                Height: =50
                Icon: =Icon.ChevronRight
                OnSelect: =Set(varModoEmpleado, "editar"); Set(varEmpleadoSeleccionado, ThisItem); Navigate(EditEmpleadoScreen, ScreenTransition.Fade)
