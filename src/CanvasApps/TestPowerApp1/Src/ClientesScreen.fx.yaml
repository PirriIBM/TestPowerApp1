                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                Width: =36
                X: =Parent.TemplateWidth - NextArrow2.Width - Self.Width - 20
                Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
