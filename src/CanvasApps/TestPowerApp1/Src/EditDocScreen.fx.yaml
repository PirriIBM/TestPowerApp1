EditDocScreen As screen:
    Fill: =RGBA(240, 244, 248, 1)

    SideNavContainerEditDoc As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(26, 26, 46, 1)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Stretch
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        Width: =250
        ZIndex: =1

        NavLogoLabelEditDoc As label:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(15, 15, 30, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =80
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            PaddingLeft: =16
            PaddingRight: =16
            Size: =20
            Text: ="MyApp"
            Width: =250
            ZIndex: =1

        NavDividerEditDoc As rectangle:
            Fill: =RGBA(255, 255, 255, 0.1)
            Height: =1
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            Width: =250
            ZIndex: =2

        NavHomeBtnEditDoc As button:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(200, 200, 220, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(26, 26, 46, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(50, 50, 80, 1)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
            PaddingLeft: =24
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 80, 160, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: ="Home"
            Width: =250
            ZIndex: =3

        NavClientesBtnEditDoc As button:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(200, 200, 220, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(26, 26, 46, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(50, 50, 80, 1)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            OnSelect: =Navigate(ClientesScreen, ScreenTransition.Fade)
            PaddingLeft: =24
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 80, 160, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: ="Clientes"
            Width: =250
            ZIndex: =4

        NavTicketsBtnEditDoc As button:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Color: =RGBA(200, 200, 220, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(26, 26, 46, 1)
            Font: =Font.'Segoe UI'
            Height: =56
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(50, 50, 80, 1)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =0
            LayoutMinWidth: =0
            OnSelect: =Navigate(TicketsScreen, ScreenTransition.Fade)
            PaddingLeft: =24
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 80, 160, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =15
            Text: ="Tickets"
            Width: =250
            ZIndex: =5

    ContentAreaEditDoc As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(240, 244, 248, 1)
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =16
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =32
        PaddingLeft: =32
        PaddingRight: =32
        PaddingTop: =32
        Width: =Parent.Width - 250
        X: =250
        ZIndex: =2

        PageTitleLabelEditDoc As label:
            Align: =Align.Center
            Color: =RGBA(26, 26, 46, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =80
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Size: =36
            Text: ="Editar Documento"
            Width: =800
            ZIndex: =1

        PageSubtitleLabelEditDoc As label:
            Align: =Align.Center
            Color: =RGBA(100, 110, 130, 1)
            Font: =Font.'Segoe UI'
            Height: =50
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Size: =18
            Text: ="Modifica los datos del documento seleccionado"
            Width: =800
            ZIndex: =2

        LblNombreDoc As label:
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: ="Nombre"
            Width: =800
            ZIndex: =3

        TxtNombreDoc As text:
            BorderColor: =RGBA(220, 222, 230, 1)
            BorderStyle: =BorderStyle.Solid
            BorderThickness: =1
            Color: =RGBA(50, 49, 48, 1)
            Default: =varDocSeleccionado.Name
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =14
            Width: =800
            ZIndex: =4

        LblAutorDocTitulo As label:
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: ="Autor"
            Width: =800
            ZIndex: =5

        LblAutorDocValor As label:
            Color: =RGBA(96, 94, 92, 1)
            Fill: =RGBA(240, 244, 248, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: =varDocSeleccionado.Author.DisplayName
            Width: =800
            ZIndex: =6

        LblModificadoDocTitulo As label:
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: ="Fecha de modificacion"
            Width: =800
            ZIndex: =7

        LblModificadoDocValor As label:
            Color: =RGBA(96, 94, 92, 1)
            Fill: =RGBA(240, 244, 248, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: =Text(varDocSeleccionado.Modified, "dd/mm/yyyy")
            Width: =800
            ZIndex: =8

        LblCreadoDocTitulo As label:
            Color: =RGBA(50, 49, 48, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =32
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: ="Fecha de creacion"
            Width: =800
            ZIndex: =9

        LblCreadoDocValor As label:
            Color: =RGBA(96, 94, 92, 1)
            Fill: =RGBA(240, 244, 248, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            Text: =Text(varDocSeleccionado.Created, "dd/mm/yyyy")
            Width: =800
            ZIndex: =10

        BtnGuardarDoc As button:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =44
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(0, 100, 180, 1)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            OnSelect: |-
                =Patch(Documents, varDocSeleccionado, {Name: TxtNombreDoc.Text}); Back()
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 80, 160, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =15
            Text: ="Guardar"
            Width: =380
            ZIndex: =11

        BtnCancelarDoc As button:
            BorderColor: =RGBA(220, 222, 230, 1)
            BorderThickness: =1
            Color: =RGBA(50, 49, 48, 1)
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =RGBA(220, 222, 230, 1)
            HoverColor: =RGBA(50, 49, 48, 1)
            HoverFill: =RGBA(240, 244, 248, 1)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            OnSelect: =Back()
            PressedBorderColor: =RGBA(220, 222, 230, 1)
            PressedColor: =RGBA(50, 49, 48, 1)
            PressedFill: =RGBA(220, 222, 230, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =15
            Text: ="Cancelar"
            Width: =380
            ZIndex: =12

